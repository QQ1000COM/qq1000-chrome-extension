name: release-extension

# 每次推送 main 就重新打包扩展，并把版本元数据（version.json / updates.xml）同步好。
# 版本号的唯一来源是 manifest.json 里的 version 字段。

on:
  push:
    branches: [main]
    paths-ignore:
      - "version.json"
      - "updates.xml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取 manifest 版本号
        id: version
        run: |
          python3 -c "
          import json
          print('version=' + json.load(open('manifest.json', encoding='utf-8'))['version'])
          " >> "$GITHUB_OUTPUT"

      - name: 打包扩展（排除仓库自身文件）
        run: |
          zip -r qq1000-chrome-extension.zip . \
            -x '.git/*' -x '.github/*' -x '*.bak' -x '*.bak-*' \
            -x 'qq1000-chrome-extension.zip' -x 'README.md'

      - name: 发布 Release（tag = v版本号）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: qq1000-chrome-extension.zip
          generate_release_notes: true

      - name: 同步 version.json / updates.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib, datetime

          version = os.environ["VERSION"]
          repo = "QQ1000COM/qq1000-chrome-extension"
          zip_url = f"https://github.com/{repo}/releases/latest/download/qq1000-chrome-extension.zip"
          page_url = f"https://github.com/{repo}/releases/latest"

          payload = {
              "version": version,
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "zipUrl": zip_url,
              "downloadUrl": page_url,
              "notes": "",
          }
          pathlib.Path("version.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          xml = pathlib.Path("updates.xml")
          text = xml.read_text(encoding="utf-8")
          text = re.sub(r"version='[^']*'", f"version='{version}'", text)
          text = re.sub(
              r"codebase='[^']*'",
              f"codebase='https://github.com/{repo}/releases/latest/download/qq1000-chrome-extension.crx'",
              text,
          )
          xml.write_text(text, encoding="utf-8")
          print("version ->", version)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json updates.xml
          if git diff --cached --quiet; then
            echo "版本元数据无变化"
          else
            git commit -m "chore: 同步版本元数据到 v${VERSION} [skip ci]"
            git push
          fi
